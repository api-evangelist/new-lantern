aid: new-lantern
name: New Lantern
description: >-
  New Lantern is a cloud-native, AI-native radiology platform that unifies the
  worklist, PACS/DICOM viewer, and AI-powered reporting into a single
  browser-based workspace, replacing the fragmented multi-system software stack
  most radiology practices run today. Its cloud-native DICOM viewer offers
  3D/MPR/MIP reconstruction, mammography and PET/CT modes, and AI hanging
  protocols; its Curie AI reporting assistant drafts reports that a licensed
  radiologist reviews, edits, and signs; and NL-Vox provides radiology-tuned
  speech recognition, alongside intelligent worklist and case distribution,
  analytics, and native Epic/Oracle Health EHR integration. Founded in 2021 and
  headquartered in San Francisco, New Lantern is backed by a $19M Series A led
  by Benchmark and is FDA registered as a Class I medical image communications
  device (21 CFR 892.2020). New Lantern does not currently expose a public
  developer API; this profile captures its company identity and public
  web/security posture.
